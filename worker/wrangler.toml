name = "worker-placeholder" # Overridden by CI secrets
main = "src/index.ts"
compatibility_date = "2024-01-01"


# [vars] Environment Variables
# NOTE: To prevent values from being reset on each deployment:
# 1. Comment out the [vars] section below (or keep as examples only)
# 2. Set environment variables directly in Cloudflare Dashboard:
#    Workers & Pages > Your Worker > Settings > Variables
# This way, your values will persist across deployments.

[vars]
MAINTENANCE_PAGE_URL = "http://lshworkspace-maintenance-page.pages.dev"
MAINTENANCE_MODE = "true"

# Routes are configured via GitHub Secrets (CLOUDFLARE_WORKER_ROUTE) in CI/CD

# Exclude static assets by NOT defining routes for them (Cloudflare default behavior is strictly matching configured routes)
