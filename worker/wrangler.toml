name = "worker-placeholder" # Overridden by CI secrets
main = "src/index.ts"
compatibility_date = "2024-01-01"

routes = [
    { pattern = "lshworkspace.com/*", zone_name = "lshworkspace.com" },
    { pattern = "www.lshworkspace.com/*", zone_name = "lshworkspace.com" },
]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
