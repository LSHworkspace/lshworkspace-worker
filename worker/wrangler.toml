name = "worker-placeholder" # Overridden by CI secrets
main = "src/index.ts"
compatibility_date = "2024-01-01"
keep_vars = true

# Runtime switches are managed by GitHub Actions or the Cloudflare dashboard.
# MAINTENANCE_SYSTEM_ENABLED=false bypasses forced mode and automatic detection.
# FORCED_MAINTENANCE_ENABLED=true serves maintenance without checking the origin.

routes = [
    { pattern = "lshworkspace.com/*", zone_name = "lshworkspace.com" },
    { pattern = "www.lshworkspace.com/*", zone_name = "lshworkspace.com" },
]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
